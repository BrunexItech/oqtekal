# /etc/nginx/sites-available/oqtekal.com — host nginx in front of the Docker stack.
# Replace 8091 below if WEB_PORT in .env.production is different.
# Cloudflare: proxied (orange cloud), SSL/TLS mode "Full (strict)", Origin Certificate installed below.

server {
    listen 80;
    listen [::]:80;
    server_name oqtekal.com www.oqtekal.com;
    return 301 https://oqtekal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.oqtekal.com;
    ssl_certificate     /etc/ssl/cloudflare/oqtekal.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oqtekal.com.key;
    return 301 https://oqtekal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oqtekal.com;

    ssl_certificate     /etc/ssl/cloudflare/oqtekal.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oqtekal.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;   # admin image uploads

    # Real visitor IPs from Cloudflare (keep in sync: https://www.cloudflare.com/ips/)
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/cloudflare-ips.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:8091;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
