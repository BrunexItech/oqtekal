name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

  e2e:
    name: Build, end-to-end & accessibility
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oqtekal
          POSTGRES_PASSWORD: oqtekal
          POSTGRES_DB: oqtekal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oqtekal" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://oqtekal:oqtekal@localhost:5432/oqtekal
      PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret-1234
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run build
      - name: Start server
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000/next/health --timeout 120000
      - run: npm run test:e2e
      - name: Lighthouse budgets
        run: npx --yes @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
